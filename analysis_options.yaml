# Regras de lint do projeto. Rode `flutter analyze` antes de cada commit:
# a entrega exige código sem prints, imports não usados ou código morto.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    unused_import: error
    unused_element: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_child_properties_last
    - use_super_parameters
    - directives_ordering
